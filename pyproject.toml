[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oblique-thermal-opd"
version = "0.1.0"
description = "Semi-analytical thermal and OPD modeling for oblique Gaussian heating"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]